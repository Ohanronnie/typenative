[workspace]
resolver = "2"
members = [
  "crates/tn-cli",
  "crates/tn-codegen-llvm",
  "crates/tn-diagnostics",
  "crates/tn-driver",
  "crates/tn-hir",
  "crates/tn-mir",
  "crates/tn-node-api",
  "crates/tn-syntax",
  "crates/tn-test-support",
  "crates/tn-typecheck",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5.47", features = ["derive"] }
codespan-reporting = "0.12.0"
indexmap = { version = "2.11.1", features = ["serde"] }
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
logos = "0.15.1"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
proptest = "1.7.0"
rowan = "0.16.1"
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.22.0"
thiserror = "2.0.16"
unicode-ident = "1.0.19"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "none"
