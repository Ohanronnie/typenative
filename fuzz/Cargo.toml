[package]
name = "tn-syntax-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
tn-hir = { path = "../crates/tn-hir" }
tn-mir = { path = "../crates/tn-mir" }
tn-node-api = { path = "../crates/tn-node-api" }
tn-syntax = { path = "../crates/tn-syntax" }
tn-typecheck = { path = "../crates/tn-typecheck" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
